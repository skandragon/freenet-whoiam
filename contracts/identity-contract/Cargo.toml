[package]
name = "identity-contract"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "whoiam public identity contract"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["freenet-main-contract"]
freenet-main-contract = []

[dependencies]
serde.workspace = true
ciborium.workspace = true
ed25519-dalek.workspace = true
freenet-stdlib.workspace = true
whoiam-core.workspace = true
# Stub getrandom backend so wasmtime can instantiate the module
# (freenet/river#241). No RNG is ever called in contract code paths.
getrandom = { workspace = true, features = ["custom"] }

[dev-dependencies]
rand.workspace = true
ed25519-dalek = { workspace = true, features = ["rand_core"] }
