[package]
name = "whoiam-demo"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Demo Freenet app: verify a whoiam connect proof and show the persona's profile"

[dependencies]
whoiam-core.workspace = true
freenet-stdlib = { workspace = true, features = ["net"] }
bs58.workspace = true
base64 = "0.22"
data-encoding.workspace = true
ed25519-dalek.workspace = true
rand.workspace = true
# Browser build only — see the note in ui/Cargo.toml (freenet/river#241).
getrandom = { workspace = true, features = ["js"] }

dioxus = { version = "0.7", features = ["web"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
futures = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Location",
    "UrlSearchParams",
    "Url",
    "WebSocket",
    "MessageEvent",
    "console",
] }
